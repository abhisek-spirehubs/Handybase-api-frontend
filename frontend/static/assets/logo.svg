<svg width="420" height="100" viewBox="0 0 420 100" xmlns="http://www.w3.org/2000/svg">

  <!-- DEFINITIONS -->
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ICON -->
  <polygon points="20,20 50,5 80,20 50,35" fill="url(#grad1)"/>
  <polygon points="20,20 50,35 50,80 20,65" fill="url(#grad1)"/>
  <polygon points="50,35 80,20 80,65 50,80" fill="url(#grad1)" opacity="0.85"/>

  <polygon points="120,20 150,5 180,20 150,35" fill="url(#grad2)"/>
  <polygon points="120,20 150,35 150,80 120,65" fill="url(#grad2)"/>
  <polygon points="150,35 180,20 180,65 150,80" fill="url(#grad2)" opacity="0.85"/>

  <!-- Nodes -->
  <rect x="80" y="45" width="12" height="12" fill="#A855F7"/>
  <rect x="100" y="30" width="12" height="12" fill="#22D3EE"/>
  <rect x="120" y="45" width="12" height="12" fill="#22D3EE"/>

  <!-- Connections -->
  <line x1="86" y1="51" x2="106" y2="36" stroke="#94A3B8" stroke-width="2"/>
  <line x1="106" y1="36" x2="126" y2="51" stroke="#94A3B8" stroke-width="2"/>

  <!-- DARK BACKGROUND FOR TEXT -->
  <rect x="200" y="25" width="190" height="50" rx="12" fill="#020617" opacity="0.9"/>

  <!-- TEXT -->
  <text x="215" y="58"
        font-family="Poppins, Arial, sans-serif"
        font-size="28"
        font-weight="600"
        fill="url(#textGrad)"
        filter="url(#glow)">
    Handy<tspan fill="#3B82F6">Base</tspan>
  </text>

</svg>