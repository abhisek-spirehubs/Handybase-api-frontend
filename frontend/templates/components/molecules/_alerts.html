{% load i18n %}
{% if messages %}
    <div class="space-y-4 mb-6">
    {% for message in messages %}
        <div class="p-4 rounded-lg border {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800{% else %}bg-emerald-50 border-emerald-200 text-emerald-800{% endif %}" role="alert">
            <div class="flex">
                <div class="flex-shrink-0">
                    {% if message.tags == 'error' %}
                        <svg class="size-5 text-red-400 mt-0.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                    {% else %}
                        <svg class="size-5 text-emerald-400 mt-0.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    {% endif %}
                </div>
                <div class="ms-3">
                    <p class="text-sm font-medium">{{ message }}</p>
                </div>
            </div>
        </div>
    {% endfor %}
    </div>
{% endif %}
