{% load i18n %}
<!-- components/atoms/_button.html -->
<button 
    type="{{ type|default:'button' }}" 
    class="w-full py-2.5 px-4 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition shadow-sm"
>
    {% if text %}{% trans text %}{% else %}{{ block.super|default:'' }}{% endif %}
</button>
