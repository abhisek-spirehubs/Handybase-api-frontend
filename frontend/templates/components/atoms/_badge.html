{% load i18n %}
<span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-bold uppercase tracking-widest 
    {% if type == 'success' %}text-emerald-700 bg-emerald-50 border border-emerald-200
    {% elif type == 'warning' %}text-amber-700 bg-amber-50 border border-amber-200
    {% elif type == 'danger' %}text-red-700 bg-red-50 border border-red-200
    {% elif type == 'info' %}text-blue-800 bg-blue-100 border border-blue-200
    {% else %}text-muted-foreground bg-background border border-border{% endif %}">
    {% if text %}{% trans text %}{% else %}{{ block.super|default:'' }}{% endif %}
</span>
