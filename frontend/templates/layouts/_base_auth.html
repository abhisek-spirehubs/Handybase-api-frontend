<!DOCTYPE html>
{% load i18n static %}
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HandyBase{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-background text-foreground min-h-screen">

    <!-- HEADER -->
    <header class="bg-secondary border-b border-border">
        <nav class="max-w-[1400px] mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">

            <!-- LOGO ONLY -->
            <a href="{% url 'home' %}" class="flex items-center group">
                <img src="{% static 'assets/logo.svg' %}" 
                     alt="HandyBase Logo"
                     class="h-8 w-auto object-contain transition duration-300 group-hover:drop-shadow-[0_0_8px_#3B82F6]" />
            </a>

            <!-- LANGUAGE SWITCHER -->
            {% include 'components/molecules/_language_switcher.html' %}

        </nav>
    </header>

    <!-- MAIN -->
    <main class="min-h-[calc(100vh-73px)] flex flex-col justify-center items-center p-4 sm:p-6">
        <div class="w-full flex justify-center">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>

</html>
